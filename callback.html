<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VaultMind — TikTok Authorization</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; margin: 80px auto; padding: 0 20px; line-height: 1.6; color: #222; text-align: center; }
  code { background: #f2f2f2; padding: 4px 8px; border-radius: 4px; word-break: break-all; display: inline-block; margin-top: 12px; }
  .ok { color: #0a8a3c; font-weight: 600; }
</style>
</head>
<body>
  <h1>TikTok Authorization</h1>
  <p id="status">Waiting for authorization response…</p>
  <code id="code" style="display:none;"></code>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const statusEl = document.getElementById("status");
    const codeEl = document.getElementById("code");
    if (code) {
      statusEl.textContent = "Authorization successful. You may now close this window.";
      statusEl.className = "ok";
      codeEl.textContent = "code: " + code;
      codeEl.style.display = "inline-block";
    } else if (error) {
      statusEl.textContent = "Authorization failed: " + error;
    } else {
      statusEl.textContent = "No authorization response received.";
    }
  </script>
</body>
</html>
