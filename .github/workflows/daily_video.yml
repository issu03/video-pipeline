name: VaultMind Daily Video

on:
  schedule:
    - cron: '0 16 * * 2,4'    # Tue+Thu 17:00 CET (peak)
    - cron: '0 18 * * 1,3,5'  # Mon/Wed/Fri 19:00 CET
    - cron: '0 8 * * 6,0'     # Sat+Sun 09:00 CET
  workflow_dispatch:

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak libcairo2-dev pkg-config python3-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Prepare background music
        run: |
          if [ ! -f "bg_music.mp3" ]; then
            curl -L -o bg_music.mp3 \
              "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" \
              || echo "Music unavailable"
          fi

      - name: Run video pipeline
        env:
          GAMEPLAY_PATH:            ${{ github.workspace }}/gameplay_bg.mp4
          MUSIC_PATH:               ${{ github.workspace }}/bg_music.mp3
          GROQ_API_KEY:             ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_KEY:           ${{ secrets.ELEVENLABS_KEY }}
          ELEVEN_VOICE_ID:          ${{ secrets.ELEVEN_VOICE_ID }}
          PEXELS_KEY:               ${{ secrets.PEXELS_KEY }}
          YOUTUBE_TOKEN_B64:        ${{ secrets.YOUTUBE_TOKEN_B64 }}
          BUFFER_ACCESS_TOKEN:      ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_TIKTOK_PROFILE_ID: ${{ secrets.BUFFER_TIKTOK_PROFILE_ID }}
        run: python pipeline.py 1

      - name: Commit dashboard.json
        if: always()
        run: |
          git config user.name  "VaultMind Bot"
          git config user.email "bot@vaultmind.auto"
          git add dashboard.json || true
          git diff --cached --quiet && echo "Nothing to commit" || \
            (git commit -m "📊 Dashboard update [$(date '+%Y-%m-%d %H:%M')]" && git push)
