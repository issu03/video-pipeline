name: VaultMind Daily Video
 
on:
  schedule:
    - cron: '0 9 * * *'  # Every day at 9:00 AM UTC (10:00 CET)
  workflow_dispatch:       # Also allow manual trigger
 
jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install Python dependencies
        run: pip install -r requirements.txt
 
      - name: Run video pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_KEY: ${{ secrets.ELEVENLABS_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: python pipeline.py 1
 
