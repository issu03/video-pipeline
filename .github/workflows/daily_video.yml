name: VaultMind Video Pipeline v2

on:
  schedule:
    - cron: '0 16 * * 2,4'    # Di+Do  17:00 CET
    - cron: '0 18 * * 1,3,5'  # Mo/Mi/Fr 19:00 CET
    - cron: '0 8  * * 6,0'    # Sa+So   09:00 CET
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche override (reddit|dating|rich|lifehack|fact|scary|motivation|conspiracy|learn)"
        required: false
        default: ""

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-dejavu-core \
            fonts-liberation
          echo "ffmpeg: $(ffmpeg -version | head -1)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run video pipeline
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_KEY:      ${{ secrets.ELEVENLABS_KEY }}
          ELEVEN_VOICE_ID:     ${{ secrets.ELEVEN_VOICE_ID }}
          PEXELS_KEY:          ${{ secrets.PEXELS_KEY }}
          ASSEMBLYAI_API_KEY:  ${{ secrets.ASSEMBLYAI_API_KEY }}
          YOUTUBE_TOKEN_B64:   ${{ secrets.YOUTUBE_TOKEN_B64 }}
          SHOTSTACK_API_KEY:   ${{ secrets.SHOTSTACK_API_KEY }}
          GAMEPLAY_PATH:       gameplay_bg.mp4
          MUSIC_PATH:          bg_music.mp3
          IMAGEIO_FFMPEG_EXE:  ffmpeg
        run: |
          python pipeline.py ${{ github.event.inputs.niche }}

      - name: Commit dashboard update
        run: |
          git config user.name  "vaultmind-bot"
          git config user.email "bot@vaultmind.auto"
          git add dashboard.json
          git diff --cached --quiet || git commit -m "chore: dashboard update [skip ci]"
          git push
