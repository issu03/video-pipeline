name: VaultMind Daily Video

on:
  schedule:
    - cron: '0 9 * * *'   # Every day 09:00 UTC = 10:00 CET / 11:00 CEST
  workflow_dispatch:        # Manual trigger

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write       # Needed to commit dashboard.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Download free lo-fi background music if not in repo
      - name: Prepare background music
        run: |
          if [ ! -f "bg_music.mp3" ]; then
            echo "Downloading background music..."
            curl -L -o bg_music.mp3 \
              "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" \
              || echo "Music download failed, continuing without"
          else
            echo "bg_music.mp3 already present"
          fi

      - name: Run video pipeline
        env:
          GAMEPLAY_PATH:          ${{ github.workspace }}/gameplay_bg.mp4
          MUSIC_PATH:             ${{ github.workspace }}/bg_music.mp3
          GROQ_API_KEY:           ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_KEY:         ${{ secrets.ELEVENLABS_KEY }}
          ELEVEN_VOICE_ID:        ${{ secrets.ELEVEN_VOICE_ID }}
          PEXELS_KEY:             ${{ secrets.PEXELS_KEY }}
          YOUTUBE_TOKEN_B64:      ${{ secrets.YOUTUBE_TOKEN_B64 }}
          BUFFER_ACCESS_TOKEN:    ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_TIKTOK_PROFILE_ID: ${{ secrets.BUFFER_TIKTOK_PROFILE_ID }}
        run: python pipeline.py 1

      # Commit updated dashboard.json so the HTML dashboard stays in sync
      - name: Commit dashboard.json
        if: always()
        run: |
          git config user.name  "VaultMind Bot"
          git config user.email "bot@vaultmind.auto"
          git add dashboard.json || true
          git diff --cached --quiet || git commit -m "📊 Dashboard update [$(date '+%Y-%m-%d %H:%M')]"
          git push || echo "Nothing to push"
