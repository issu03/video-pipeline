name: VaultMind Video Pipeline v4
# FIX: ohne diesen Block hat das Standard-GITHUB_TOKEN nur Lesezugriff.
# Das führte zum Fehler "Write access to repository not granted" /
# "fatal: ... returned error: 403" beim finalen `git push` (Exit Code 128) —
# der Job lief zwar durch und das Video wurde hochgeladen, aber der Run
# wurde trotzdem als "failed" markiert und dashboard.json nie committet.
permissions:
  contents: write
on:
  schedule:
    - cron: '0 16 * * 2,4'
    - cron: '0 18 * * 1,3,5'
    - cron: '0 8  * * 6,0'
  workflow_dispatch:
    inputs:
      niche:
        description: "Niche (reddit|dating|rich|lifehack|fact|scary|motivation|conspiracy|learn)"
        required: false
        default: ""
# Verhindert überlappende Runs (z.B. manueller Trigger während eines
# geplanten Runs), die zu doppeltem/kollidierendem git push führen könnten.
concurrency:
  group: vaultmind-pipeline
  cancel-in-progress: false
jobs:
  generate-video:
    runs-on: ubuntu-latest
    # 35→60: ein Retry-Versuch (siehe "Run pipeline" unten) kann im
    # Worst Case zwei Läufe hintereinander brauchen; eure längsten
    # erfolgreichen Runs lagen bei ~23min, 35min reichte da knapp nicht
    # für zwei Versuche.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: System deps (ffmpeg + fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-dejavu-core fonts-liberation fonts-open-sans
          echo "ffmpeg: $(ffmpeg -version | head -1)"
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install yt-dlp for viral video analysis
        run: pip install yt-dlp --break-system-packages -q
      - name: Fix beautiful-captions import bug
        run: |
          python3 -c "
          import site, pathlib, subprocess
          pkg = pathlib.Path(site.getsitepackages()[0]) / 'beautiful_captions'
          if pkg.exists():
              for f in pkg.rglob('*.py'):
                  t = f.read_text()
                  if 'from src.beautiful_captions' in t:
                      f.write_text(t.replace('from src.beautiful_captions.core.', 'from .'))
                      print('Patched:', f)
          "
      - name: Run pipeline
        uses: nick-fields/retry@v3
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          ELEVENLABS_KEY:      ${{ secrets.ELEVENLABS_KEY }}
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          PEXELS_KEY:          ${{ secrets.PEXELS_KEY }}
          ASSEMBLYAI_API_KEY:  ${{ secrets.ASSEMBLYAI_API_KEY }}
          YOUTUBE_TOKEN_B64:   ${{ secrets.YOUTUBE_TOKEN_B64 }}
          JSON2VIDEO_API_KEY:  ${{ secrets.JSON2VIDEO_API_KEY }}
          SHOTSTACK_API_KEY:   ${{ secrets.SHOTSTACK_API_KEY }}
          CREATOMATE_API_KEY:  ${{ secrets.CREATOMATE_API_KEY }}
          PIXABAY_KEY:         ${{ secrets.PIXABAY_KEY }}
          JAMENDO_CLIENT_ID:   ${{ secrets.JAMENDO_CLIENT_ID }}
          GAMEPLAY_PATH:       gameplay_bg.mp4
          MUSIC_PATH:          bg_music.mp3
          IMAGEIO_FFMPEG_EXE:  ffmpeg
        with:
          # 28min: großzügig über euren längsten beobachteten erfolgreichen
          # Läufen (~23min), damit ein normal-langsamer Run nicht fälschlich
          # als "hängt" abgebrochen wird.
          timeout_minutes: 28
          max_attempts: 2
          command: python pipeline.py ${{ github.event.inputs.niche }}
      - name: Commit dashboard
        run: |
          git config user.name  "vaultmind-bot"
          git config user.email "bot@vaultmind.auto"
          git add dashboard.json
          git diff --cached --quiet || git commit -m "chore: dashboard [skip ci]"
          git push
      - name: Notify on failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -d "{\"content\":\"⚠️ VaultMind daily_video.yml failed — Run ${GITHUB_RUN_ID} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})\"}" \
               "${{ secrets.DISCORD_WEBHOOK_URL }}"
